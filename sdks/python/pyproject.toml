[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-router"
version = "1.0.0"
authors = [
  { name="Outcome Router Team", email="dev@outcomerouter.com" },
]
description = "Python Client for Outcome-Indexed AI Spend Router - 40% Token Cost Reduction by Routing to Highest-Outcome Models"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]
